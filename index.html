<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En Tren Verde — Tienda</title>
<link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1HhSUslx9aiJ3ck3srQT3Y7QBZ9cbtnWw&sz=w200">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --verde:        #1F5C2E;
    --verde-medio:  #2E7D42;
    --verde-claro:  #E8F4EC;
    --mostaza:      #C9A84C;
    --mostaza-hover:#B8923E;
    --crema:        #F5F0E8;
    --crema-card:   #FDFAF5;
    --texto:        #1A2E1D;
    --texto-suave:  #5A6E5C;
    --borde:        #DDD8CF;
    --blanco:       #FFFFFF;
    --rojo:         #C0392B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 400;
    background: var(--crema);
    color: var(--texto);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--verde);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    flex-shrink: 0;
  }

  .logo-sol {
    width: 42px;
    height: 42px;
    object-fit: contain;
  }

  .logo-desktop {
    display: none;
    height: 42px;
    width: auto;
    max-width: 200px;
    object-fit: contain;
  }

  @media (min-width: 700px) {
    .logo-sol     { display: none; }
    .logo-desktop { display: block; }
  }

  .search-bar {
    flex: 1;
    max-width: 480px;
    position: relative;
  }

  .search-bar input {
    width: 100%;
    padding: 9px 16px 9px 40px;
    border-radius: 24px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: var(--blanco);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: background 0.2s;
  }

  .search-bar input::placeholder { color: rgba(255,255,255,0.6); }
  .search-bar input:focus { background: rgba(255,255,255,0.25); }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.7);
    pointer-events: none;
  }

  .cart-btn {
    position: relative;
    background: var(--mostaza);
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .cart-btn:hover { background: var(--mostaza-hover); }
  .cart-btn svg { color: var(--blanco); }

  .cart-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--rojo);
    color: white;
    font-size: 0.65rem;
    font-weight: 700;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    display: none;
  }

  /* ── CATEGORÍAS ── */
  .hamburguesa-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--blanco);
    border: none;
    border-bottom: 1px solid var(--borde);
    width: 100%;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--texto);
    transition: background 0.15s;
    position: sticky;
    top: 64px;
    z-index: 99;
  }
  .hamburguesa-btn:hover { background: var(--verde-claro); }
  .hamburguesa-icon {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 20px;
  }
  .hamburguesa-icon span {
    display: block;
    height: 2px;
    background: var(--verde);
    border-radius: 2px;
    transition: all 0.25s;
  }
  .hamburguesa-btn.abierto .hamburguesa-icon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .hamburguesa-btn.abierto .hamburguesa-icon span:nth-child(2) { opacity: 0; }
  .hamburguesa-btn.abierto .hamburguesa-icon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .hamburguesa-btn.abierto { background: var(--verde-claro); color: var(--verde); }

  .hamburguesa-label-cat {
    font-size: 0.78rem;
    color: var(--texto-suave);
    font-weight: 500;
    margin-left: auto;
  }

  .cat-dropdown {
    display: none;
    flex-direction: column;
    background: var(--blanco);
    border-bottom: 1px solid var(--borde);
    overflow: hidden;
  }
  .cat-dropdown.abierto { display: flex; }

  .cat-dropdown .cat-btn {
    flex-direction: row;
    justify-content: flex-start;
    border-radius: 0;
    padding: 11px 20px;
    gap: 10px;
    font-size: 0.88rem;
    border-bottom: 1px solid var(--borde);
    width: 100%;
  }
  .cat-dropdown .cat-btn:last-child { border-bottom: none; }
  .cat-dropdown .cat-btn.activa { background: var(--verde-claro); color: var(--verde); }

  .categorias-wrap {
    display: none;
    background: var(--blanco);
    border-bottom: 1px solid var(--borde);
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 64px;
    z-index: 99;
  }
  .categorias-wrap::-webkit-scrollbar { display: none; }

  .categorias-inner {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    width: max-content;
    min-width: 100%;
    justify-content: center;
  }

  .cat-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    border-radius: 16px;
    border: none;
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    color: var(--texto-suave);
    font-weight: 600;
  }

  .cat-btn.activa, .cat-btn:hover {
    background: var(--verde-claro);
    border-color: transparent;
    color: var(--verde);
  }

  .cat-emoji { font-size: 1.2rem; }

  @media (min-width: 700px) {
    .hamburguesa-btn  { display: none; }
    .cat-dropdown     { display: none !important; }
    .categorias-wrap  { display: block; }
  }

  /* ── CONTENIDO PRINCIPAL ── */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

    .seccion-titulo {
    font-family: Georgia, serif;
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--verde);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--mostaza);
    display: inline-block;
  }

  /* ── GRILLA ── */
  .grilla {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  @media (min-width: 600px) {
    .grilla { grid-template-columns: repeat(3, 1fr); gap: 18px; }
  }

  @media (min-width: 900px) {
    .grilla { grid-template-columns: repeat(4, 1fr); gap: 20px; }
  }

  @media (min-width: 1100px) {
    .grilla { grid-template-columns: repeat(5, 1fr); }
  }

  /* ── TARJETA ── */
  .tarjeta {
    background: var(--crema-card);
    border-radius: 16px;
    border-left: 3px solid var(--mostaza);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .tarjeta:hover {
    box-shadow: 0 4px 16px rgba(31,92,46,0.10);
    background: var(--verde-claro);
    border-left-color: var(--verde);
  }

  .tarjeta:hover .variante-btn {
    background: var(--blanco);
  }

  .tarjeta-foto {
    width: 100%;
    aspect-ratio: 1;
    object-fit: contain;
    padding: 16px;
    background: var(--blanco);
  }

  .tarjeta-foto-placeholder {
    width: 100%;
    aspect-ratio: 1;
    background: var(--blanco);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: var(--borde);
  }

  .tarjeta-body {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .tarjeta-nombre {
    font-size: 1.05rem;
    font-weight: 700;
    font-family: Georgia, serif;
    color: var(--texto);
    line-height: 1.3;
    height: calc(1.05rem * 1.3 * 2);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .tarjeta-marca {
    font-size: 0.8rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    color: var(--texto-suave);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    height: 1rem;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .variantes-lista {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 100%;
    min-height: calc(4 * 36px + 3 * 5px);
  }

  .variante-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    border-radius: 20px;
    border: 1.5px solid var(--borde);
    background: var(--crema);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--texto);
    transition: all 0.25s ease;
    width: 100%;
  }

  .variante-btn:hover {
    border-color: var(--mostaza);
    background: var(--crema);
  }

  .variante-btn:active {
    border: 2.5px solid var(--verde);
    background: var(--verde-claro);
    transform: scale(0.98);
    transition: transform 0s, border 0s, background 0s;
  }

  .variante-btn.oferta {
    border-color: var(--rojo);
    background: #FFF5F5;
  }

  .variante-btn .plus {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--mostaza);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: 900;
    line-height: 1;
    padding-bottom: 1px;
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s;
  }

  .variante-btn:hover .plus { background: var(--mostaza-hover); }

  .variante-info {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    flex: 1;
  }

  .variante-label { font-size: 0.82rem; font-family: 'Inter', sans-serif; font-weight: 500; color: var(--texto-suave); text-align: left; }
  .variante-precio { font-size: 0.95rem; font-weight: 700; font-family: 'Inter', sans-serif; color: var(--verde); text-align: left; }

  .badge-oferta {
    font-size: 0.6rem;
    background: var(--rojo);
    color: white;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 700;
  }

  /* ── TOAST ── */
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(20px); }
  }

  .toast {
    position: fixed;
    bottom: 32px;
    right: 24px;
    background: var(--blanco);
    border-left: 4px solid var(--mostaza);
    border-radius: 14px;
    padding: 14px 18px;
    min-width: 260px;
    max-width: 320px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    opacity: 0;
    z-index: 9999;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: box-shadow 0.15s, transform 0.15s;
  }

  .toast.visible { pointer-events: auto; }
  .toast.visible:hover {
    box-shadow: 0 10px 36px rgba(31,92,46,0.18);
    transform: translateY(-2px);
  }

  .toast-ver-carrito {
    font-size: 0.72rem;
    color: var(--verde);
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    margin-top: 2px;
    letter-spacing: 0.02em;
  }

  .toast.visible {
    animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .toast.hiding {
    animation: toastOut 0.3s ease forwards;
  }

  .toast-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--verde-claro);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1.1rem;
  }

  .toast-content {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .toast-titulo {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--texto-suave);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-family: 'Inter', sans-serif;
  }

  .toast-nombre {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--texto);
    font-family: Georgia, serif;
    line-height: 1.2;
  }

  /* ── PANEL CARRITO ── */
  .carrito-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 300;
  }

  .carrito-overlay.abierto { display: block; }

  .carrito-panel {
    position: fixed;
    top: 0;
    right: -100%;
    width: min(420px, 100vw);
    height: 100vh;
    height: 100dvh;
    background: var(--blanco);
    z-index: 301;
    display: flex;
    flex-direction: column;
    transition: right 0.3s ease;
    box-shadow: -4px 0 24px rgba(0,0,0,0.12);
  }

  .carrito-panel.abierto { right: 0; }

  .carrito-header {
    background: var(--verde);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .carrito-header h2 {
    font-family: 'Inter', sans-serif;
    font-size: 1.3rem;
  }

  .cerrar-btn {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    padding: 4px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .cerrar-btn:hover { background: rgba(255,255,255,0.2); }

  .carrito-items {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .carrito-vacio {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--texto-suave);
  }

  .carrito-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    background: var(--crema);
    border-radius: 10px;
    border-left: 3px solid var(--mostaza);
  }

  .item-info { flex: 1 }
  .item-nombre { font-size: 0.9rem; font-weight: 600; font-family: 'Inter', sans-serif; line-height: 1.3; }
  .item-variante { font-size: 0.75rem; color: var(--texto-suave); }
  .item-precio { font-size: 1rem; font-weight: 700; font-family: 'Inter', sans-serif; color: var(--verde); }

  .item-controles {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ctrl-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--borde);
    background: white;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    transition: all 0.25s ease;
  }

  .ctrl-btn:hover { border-color: var(--verde); color: var(--verde); }
  .ctrl-qty { font-weight: 700; font-size: 0.9rem; min-width: 20px; text-align: center; }

  .carrito-footer {
    border-top: 1px solid var(--borde);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .total-label { font-size: 1rem; font-weight: 600; }
  .total-monto { font-family: 'Inter', sans-serif; font-size: 1.4rem; color: var(--verde); }

  .btn-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px;
    background: #25D366;
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    text-decoration: none;
  }

  .btn-whatsapp:hover { background: #1da851; }

  /* ── MODAL PRODUCTO ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 400;
    align-items: flex-end;
    justify-content: center;
  }

  @media (min-width: 600px) {
    .modal-overlay { align-items: center; }
  }

  .modal-overlay.abierto { display: flex; }

  .modal {
    background: var(--blanco);
    width: min(560px, 100vw);
    max-height: 90vh;
    border-radius: 20px 20px 0 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 600px) {
    .modal { border-radius: 20px; max-height: 85vh; }
  }

  /* ── DOS COLUMNAS en desktop ── */
  @media (min-width: 700px) {
    .modal {
      width: min(860px, 92vw);
      flex-direction: row;
      overflow-y: visible;
      height: 520px;
      max-height: 88vh;
      position: relative;
    }
    .modal-foto-wrap {
      width: 340px;
      flex-shrink: 0;
      border-radius: 20px 0 0 20px;
      height: 100%;
      background: #ffffff;     /* CAMBIO: fondo blanco */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-foto {
      width: 100%;
      height: 100%;
      max-height: none;
      object-fit: contain;     /* foto completa sin recorte */
      padding: 8px;            /* CAMBIO: padding mínimo para foto grande */
      display: block;
      background: #ffffff;
    }
    .modal-foto-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 7rem;
      padding: 0;
      background: #ffffff;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      border-radius: 0 20px 20px 0;
      padding: 52px 28px 28px 24px;
      height: 100%;
    }
  }

  .modal-foto-wrap {
    background: #ffffff;       /* CAMBIO: fondo blanco también en mobile */
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    position: relative;
  }

  .modal-foto {
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    padding: 12px;             /* CAMBIO: menos padding en mobile */
    background: #ffffff;
  }

  .modal-foto-placeholder {
    font-size: 5rem;
    padding: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
  }

  .modal-cerrar {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: background 0.2s;
    z-index: 10;
  }

  .modal-cerrar:hover { background: var(--borde); }

  .modal { position: relative; }

  .modal-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-nombre {
    font-family: Georgia, serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--texto);
  }

  .modal-marca {
    font-size: 0.78rem;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    color: var(--texto-suave);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .modal-desc {
    font-size: 0.95rem;
    font-family: 'Inter', sans-serif;
    color: var(--texto-suave);
    line-height: 1.6;
  }

  .modal-variantes-titulo {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--texto);
  }

  .modal-variantes {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .modal-variante-btn {

// ── ESTADO ──
let categorias = [];
let productos  = [];
let variantes  = [];
let carrito    = [];
let categoriaActiva = 'all';
let busqueda   = '';

async function cargarDatos() {
  try {
    const cache = localStorage.getItem('etv_cache');
    if (cache) {
      const cached = JSON.parse(cache);
      categorias = cached.categorias;
      productos  = cached.productos;
      variantes  = cached.variantes;
      renderCategorias();
      renderProductos();
    }
  } catch(e) {}

  try {
    const res  = await fetch(API_URL);
    const data = await res.json();
    categorias = data.categorias || DATA_CATEGORIAS;
    productos  = (data.productos || DATA_PRODUCTOS).filter(p => String(p.activo).toUpperCase() === 'SI');
    variantes  = (data.variantes || DATA_VARIANTES).filter(v => String(v.activo).toUpperCase() === 'SI');
    try {
      localStorage.setItem('etv_cache', JSON.stringify({categorias, productos, variantes}));
    } catch(e) {}
  } catch(e) {
    console.warn('API no disponible, usando datos locales:', e.message);
    if (!categorias.length) {
      categorias = DATA_CATEGORIAS;
      productos  = DATA_PRODUCTOS.filter(p => p.activo === 'SI');
      variantes  = DATA_VARIANTES.filter(v => v.activo === 'SI');
    }
  }
  renderCategorias();
  renderProductos();
}

function renderCategorias() {
  const wrap = document.getElementById('categoriasInner');
  const dropdown = document.getElementById('catDropdown');

  

  const botonesDesktop = categorias.map(cat => {
    const emoji = EMOJIS_CAT[cat.nombre] || '📦';
    const icono = cat.icono_url
      ? `<img src="${convertirUrlDrive(cat.icono_url)}" alt="${cat.nombre}" style="width:40px;height:40px;object-fit:contain;" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">`
        + `<span class="cat-emoji" style="display:none">${emoji}</span>`
      : `<span class="cat-emoji">${emoji}</span>`;
    return `<button class="cat-btn" data-id="${cat.id}" onclick="filtrarCategoria('${cat.id}', this)">
      ${icono}<span>${cat.nombre}</span>
    </button>`;
  }).join('');

   const botonesDropdown = categorias.map(cat => {
    const emoji = EMOJIS_CAT[cat.nombre] || '📦';
    const icono = cat.icono_url
      ? `<img src="${convertirUrlDrive(cat.icono_url)}" alt="${cat.nombre}" style="width:32px;height:32px;object-fit:contain;" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">`
        + `<span class="cat-emoji" style="display:none">${emoji}</span>`
      : `<span class="cat-emoji">${emoji}</span>`;
    return `<button class="cat-btn" data-id="${cat.id}" onclick="filtrarCategoria('${cat.id}', this, true)">
      ${icono}<span>${cat.nombre}</span>
    </button>`;
  }).join('');

   wrap.innerHTML = botonesDesktop;
  dropdown.innerHTML = botonesDropdown;
}
function toggleHamburguesa() {
  const btn = document.getElementById('hamburguesaBtn');
  const dd  = document.getElementById('catDropdown');
  const abierto = dd.classList.contains('abierto');
  btn.classList.toggle('abierto', !abierto);
  dd.classList.toggle('abierto', !abierto);
}

function filtrarCategoria(id, btn, esDropdown) {
  categoriaActiva = id;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('activa'));
  document.querySelectorAll(`.cat-btn[data-id="${id}"]`).forEach(b => b.classList.add('activa'));

  const label = document.getElementById('hamburguesaLabel');
  if (label) {
    if (id === 'all') {
      label.textContent = 'Todas';
    } else {
      const cat = categorias.find(c => String(c.id) === String(id));
      label.textContent = cat ? cat.nombre : '';
    }
  }

  if (esDropdown) {
    document.getElementById('hamburguesaBtn').classList.remove('abierto');
    document.getElementById('catDropdown').classList.remove('abierto');
  }

  renderProductos();
}

document.getElementById('buscador').addEventListener('input', e => {
  busqueda = e.target.value.toLowerCase();
  renderProductos();
});

function renderProductos() {
  let prods = productos;
  if (categoriaActiva !== 'all') {
    prods = prods.filter(p => String(p.categoria_id) === String(categoriaActiva));
  }
  if (busqueda) {
    prods = prods.filter(p =>
      p.nombre?.toLowerCase().includes(busqueda) ||
      p.marca?.toLowerCase().includes(busqueda)
    );
  }

  const destacados = prods.filter(p => p.destacado?.toString().toUpperCase() === 'SI');
  const resto      = prods.filter(p => p.destacado?.toString().toUpperCase() !== 'SI');

  let html = '';

  if (!busqueda && categoriaActiva === 'all' && destacados.length) {
    html += `<div class="seccion">
      <div class="seccion-titulo">⭐ Más vendidos</div>
      <div class="grilla">${destacados.map(renderTarjeta).join('')}</div>
    </div>`;
    if (resto.length) {
      html += `<div class="seccion">
        <div class="seccion-titulo">Todos los productos</div>
        <div class="grilla">${resto.map(renderTarjeta).join('')}</div>
      </div>`;
    }
  } else {
    html = prods.length
      ? `<div class="seccion"><div class="grilla">${prods.map(renderTarjeta).join('')}</div></div>`
      : `<div style="text-align:center;padding:48px 20px;color:var(--texto-suave)">
           <div style="font-size:2rem">🔍</div>
           <p style="margin-top:8px">No encontramos productos con esa búsqueda.</p>
         </div>`;
  }

  document.getElementById('contenido').innerHTML = html;
}

function renderTarjeta(prod) {
  const vars = variantes.filter(v => String(v.producto_id) === String(prod.id));
  const emoji = EMOJI_PROD[prod.id] || '📦';
  const foto = prod.foto_url
    ? `<img class="tarjeta-foto" src="${convertirUrlDrive(prod.foto_url)}" alt="${prod.nombre}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';

  const botonesVar = vars.map(v => {
    const precio = parsePrecio(v.precio);
    const esOferta = v.oferta_semana?.toString().toUpperCase() === 'SI';
    return `<button class="variante-btn${esOferta?' oferta':''}"
      onclick="event.stopPropagation();agregarAlCarrito(${prod.id}, '${escHtml(v.cantidad_label)}', ${precio}, '${escHtml(prod.nombre)}')">
      <div class="plus">+</div>
      <div class="variante-info">
        <span class="variante-label">${escHtml(v.cantidad_label)}</span>
        <span class="variante-precio">${formatPrecio(precio)}</span>
      </div>
      ${esOferta ? '<span class="badge-oferta">OFERTA</span>' : ''}
    </button>`;
  }).join('');

  return `<div class="tarjeta" onclick="abrirProducto(${prod.id})">
    ${foto}
    <div class="tarjeta-foto-placeholder" style="display:${prod.foto_url?'none':'flex'}">${emoji}</div>
    <div class="tarjeta-body">
      <div class="tarjeta-marca">${prod.marca ? escHtml(prod.marca) : ''}</div>
      <div class="tarjeta-nombre">${escHtml(prod.nombre)}</div>
      <div class="variantes-lista">${botonesVar}</div>
    </div>
  </div>`;
}

function abrirProducto(id) {
  const prod = productos.find(p => String(p.id) === String(id));
  if (!prod) return;
  const vars  = variantes.filter(v => String(v.producto_id) === String(id));
  const emoji = EMOJI_PROD[id] || '📦';

  const botonesVar = vars.map(v => {
    const precio = parsePrecio(v.precio);
    return `<button class="modal-variante-btn"
      onclick="agregarAlCarrito(${prod.id}, '${escHtml(v.cantidad_label)}', ${precio}, '${escHtml(prod.nombre)}')">
      <div style="display:flex;flex-direction:column;align-items:flex-start;">
        <span class="mv-label">${escHtml(v.cantidad_label)}</span>
        <span class="mv-precio">${formatPrecio(precio)}</span>
      </div>
      <div class="mv-plus">+</div>
    </button>`;
  }).join('');

  const fotoHtml = prod.foto_url
    ? `<img class="modal-foto" src="${convertirUrlDrive(prod.foto_url)}" alt="${prod.nombre}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`
    : '';

  document.getElementById('modalContenido').innerHTML = `
    <button class="modal-cerrar" onclick="cerrarModalProducto()">✕</button>
    <div class="modal-foto-wrap">
      ${fotoHtml}
      <div class="modal-foto-placeholder" style="display:${prod.foto_url?'none':'block'}">${emoji}</div>
    </div>
    <div class="modal-body">
      ${prod.marca ? `<div class="modal-marca">${escHtml(prod.marca)}</div>` : ''}
      <h2 class="modal-nombre">${escHtml(prod.nombre)}</h2>
      ${prod.descripcion ? `<p class="modal-desc">${escHtml(prod.descripcion)}</p>` : ''}
      <div class="modal-variantes-titulo">Elegí la cantidad:</div>
      <div class="modal-variantes">${botonesVar}</div>
    </div>`;

  document.getElementById('modalProducto').classList.add('abierto');
  document.body.style.overflow = 'hidden';
}

function cerrarModalProducto() {
  document.getElementById('modalProducto').classList.remove('abierto');
  document.body.style.overflow = '';
}

function agregarAlCarrito(prodId, label, precio, nombre) {
  const key = `${prodId}_${label}`;
  const idx = carrito.findIndex(i => i.key === key);
  if (idx >= 0) {
    carrito[idx].qty++;
  } else {
    carrito.push({ key, prodId, label, precio, nombre, qty: 1 });
  }
  actualizarCarrito();
  mostrarToast(`✓ ${nombre} (${label}) añadido`);
}

function cambiarCantidad(key, delta) {
  const idx = carrito.findIndex(i => i.key === key);
  if (idx < 0) return;
  carrito[idx].qty += delta;
  if (carrito[idx].qty <= 0) carrito.splice(idx, 1);
  actualizarCarrito();
}

function actualizarCarrito() {
  const total = carrito.reduce((s, i) => s + i.precio * i.qty, 0);
  const count = carrito.reduce((s, i) => s + i.qty, 0);

  const badge = document.getElementById('cartBadge');
  badge.textContent = count;
  badge.style.display = count > 0 ? 'flex' : 'none';

  document.getElementById('totalMonto').textContent = formatPrecio(total);

  const itemsEl = document.getElementById('carritoItems');
  if (carrito.length === 0) {
    itemsEl.innerHTML = `<div class="carrito-vacio"><span style="font-size:2.5rem">🛒</span><p>Tu carrito está vacío</p></div>`;
  } else {
    itemsEl.innerHTML = carrito.map(item => `
      <div class="carrito-item">
        <div class="item-info">
          <div class="item-nombre">${escHtml(item.nombre)}</div>
          <div class="item-variante">${escHtml(item.label)}</div>
          <div class="item-precio">${formatPrecio(item.precio * item.qty)}</div>
        </div>
        <div class="item-controles">
          <button class="ctrl-btn" onclick="cambiarCantidad('${item.key}', -1)">−</button>
          <span class="ctrl-qty">${item.qty}</span>
          <button class="ctrl-btn" onclick="cambiarCantidad('${item.key}', 1)">+</button>
        </div>
      </div>`).join('');
  }

  const lineas = carrito.map(i => `• ${i.nombre} (${i.label}) x${i.qty} = ${formatPrecio(i.precio * i.qty)}`).join('\n');
  const msg = carrito.length
    ? `Hola! Quiero hacer el siguiente pedido:\n\n${lineas}\n\n*Total: ${formatPrecio(total)}*\n\nAdjunto el comprobante de transferencia.`
    : 'Hola! Quisiera consultar sobre los productos.';
  const waUrl = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  document.getElementById('btnWhatsapp').href = waUrl;
}

function toggleCarrito() {
  const panel   = document.getElementById('carritoPanel');
  const overlay = document.getElementById('carritoOverlay');
  const abierto = panel.classList.contains('abierto');
  panel.classList.toggle('abierto', !abierto);
  overlay.classList.toggle('abierto', !abierto);
  document.body.style.overflow = abierto ? '' : 'hidden';
}

document.getElementById('modalProducto').addEventListener('click', e => {
  if (e.target === document.getElementById('modalProducto')) cerrarModalProducto();
});

function parsePrecio(val) {
  if (typeof val === 'number') return val;
  return parseInt(String(val).replace(/[^0-9]/g, ''), 10) || 0;
}

function formatPrecio(n) {
  return '$' + Math.round(n).toLocaleString('es-AR');
}

function escHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function convertirUrlDrive(url) {
  if (!url) return '';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w400`;
  return url;
}

let toastTimer, toastHideTimer;
function mostrarToast(msg) {
  const t = document.getElementById('toast');
  const partes = msg.replace('✓ ', '').split(' (');
  const nombre = partes[0] || '';
  const variante = partes[1] ? partes[1].replace(') añadido', '') : '';
  t.innerHTML = `
    <div class="toast-icon">✓</div>
    <div class="toast-content">
      <span class="toast-titulo">Añadido al carrito</span>
      <span class="toast-nombre">${nombre}${variante ? ' · ' + variante : ''}</span>
      <span class="toast-ver-carrito">Ver carrito →</span>
    </div>`;
  clearTimeout(toastTimer);
  clearTimeout(toastHideTimer);
  t.classList.remove('visible', 'hiding');
  void t.offsetWidth;
  t.classList.add('visible');
  toastTimer = setTimeout(() => {
    t.classList.remove('visible');
    t.classList.add('hiding');
    toastHideTimer = setTimeout(() => t.classList.remove('hiding'), 300);
  }, 4200);
}

function toastAbrirCarrito() {
  const t = document.getElementById('toast');
  clearTimeout(toastTimer);
  clearTimeout(toastHideTimer);
  t.classList.remove('visible');
  t.classList.add('hiding');
  toastHideTimer = setTimeout(() => t.classList.remove('hiding'), 300);
  const modal = document.getElementById('modalProducto');
  if (modal.classList.contains('abierto')) cerrarModalProducto();
  const panel = document.getElementById('carritoPanel');
  if (!panel.classList.contains('abierto')) toggleCarrito();
}

cargarDatos();
